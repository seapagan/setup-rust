name: Set up Rust
description: Install a Rust toolchain specification with optional components and targets

inputs:
  toolchain:
    description: Rustup toolchain specification to install
    required: true
  components:
    description: Space-separated rustup components to install
    required: false
    default: ""
  targets:
    description: Space-separated rustup targets to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: | # zizmor: ignore[github-env] TOOLCHAIN rejects CR and LF before this fixed-name write.
        if [[ "$TOOLCHAIN" == *$'\n'* || "$TOOLCHAIN" == *$'\r'* ]]; then
          printf 'Toolchain must not contain newline characters\n' >&2
          exit 1
        fi

        rustup toolchain install "$TOOLCHAIN" --profile minimal
        printf 'RUSTUP_TOOLCHAIN=%s\n' "$TOOLCHAIN" >> "$GITHUB_ENV"

        components=()
        read -ra components <<< "$COMPONENTS"
        if (( ${#components[@]} > 0 )); then
          rustup component add --toolchain "$TOOLCHAIN" "${components[@]}"
        fi

        targets=()
        read -ra targets <<< "$TARGETS"
        if (( ${#targets[@]} > 0 )); then
          rustup target add --toolchain "$TOOLCHAIN" "${targets[@]}"
        fi
