name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_NIGHTLY: nightly-2025-06-26
  TEST_TARGET: wasm32-unknown-unknown
  TEST_TOOLCHAIN: "1.88.0"

jobs:
  components:
    name: Components (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture persistent default and verify requested toolchain differs
        shell: bash
        run: bash tests/integration/capture-state.sh "$TEST_TOOLCHAIN"

      - name: Set up Rust with components
        uses: ./
        with:
          toolchain: ${{ env.TEST_TOOLCHAIN }}
          components: rustfmt clippy

      - name: Verify persistent default, selected toolchain, and components
        shell: bash
        run: >-
          bash tests/integration/verify-state.sh "$TEST_TOOLCHAIN"
          rustfmt clippy

  toolchain-spec-and-targets:
    name: Components omitted, dated nightly with target (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture persistent default and verify requested toolchain differs
        shell: bash
        run: bash tests/integration/capture-state.sh "$TEST_NIGHTLY"

      - name: Set up dated nightly without components and with target
        uses: ./
        with:
          toolchain: ${{ env.TEST_NIGHTLY }}
          targets: ${{ env.TEST_TARGET }}

      - name: Verify persistent default, selected toolchain, and target
        shell: bash
        run: >-
          bash tests/integration/verify-state.sh "$TEST_NIGHTLY"
          --targets "$TEST_TARGET"
