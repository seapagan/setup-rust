name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_TOOLCHAIN: "1.88.0"

jobs:
  components:
    name: Components (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture persistent default and verify requested toolchain differs
        shell: bash
        run: bash tests/integration/capture-state.sh "$TEST_TOOLCHAIN"

      - name: Set up Rust with components
        uses: ./
        with:
          toolchain: ${{ env.TEST_TOOLCHAIN }}
          components: rustfmt clippy

      - name: Verify persistent default, selected toolchain, and components
        shell: bash
        run: >-
          bash tests/integration/verify-state.sh "$TEST_TOOLCHAIN"
          rustfmt clippy

  no-components:
    name: Components omitted (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture persistent default and verify requested toolchain differs
        shell: bash
        run: bash tests/integration/capture-state.sh "$TEST_TOOLCHAIN"

      - name: Set up Rust without components
        uses: ./
        with:
          toolchain: ${{ env.TEST_TOOLCHAIN }}

      - name: Verify persistent default and selected toolchain
        shell: bash
        run: bash tests/integration/verify-state.sh "$TEST_TOOLCHAIN"
